[project]
name = "portfolio-investimentos"
authors = [{ name = "Helder Meneses", email = "helder.meneses@gmail.com" }]
description = "Gestor de carteira de investimentos que corre localmente: desempenho, dividendos, fiscalidade e alertas"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = ["License :: OSI Approved :: Apache Software License"]
dynamic = ["version"]
dependencies = [
    "Flask>=3.0",
    "Flask-SQLAlchemy>=3.1",
    "waitress>=3.0",
    "openpyxl>=3.1",
    "tzdata",
]

[project.optional-dependencies]
market = ["yfinance>=0.2"]
test = ["pytest>=8.0"]
lint = ["ruff"]

[project.scripts]
portfolio-investimentos = "portfolio_investimentos.__main__:main"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "portfolio_investimentos"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]  # erros de sintaxe, importações e nomes por usar

name: Executável único (PyInstaller)

# Gera o executável para Windows, macOS e Linux (e a APK para Android), para quem não quer instalar o Python, e confirma que arranca
# e serve as páginas. Numa etiqueta v* (ex.: v0.5.0), junta os executáveis a uma release do GitHub. Corrido à mão
# com «etiqueta» preenchida, cria essa etiqueta (no commit escolhido) e a release, sem ser preciso enviar a etiqueta.
on:
  workflow_dispatch:
    inputs:
      etiqueta:
        description: "Versão a publicar como release (ex.: v0.5.0); vazio = só gerar e experimentar"
        required: false
        default: ""
  push:
    tags: ["v*"]
  pull_request:
    paths: ["packaging/**", "android/**", ".github/workflows/executavel.yml", "requirements.txt", "pyproject.toml"]

permissions:
  contents: write

jobs:
  construir:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ficheiro: PortfolioInvestimentos.exe
            nome: PortfolioInvestimentos-windows.exe
          - os: macos-latest
            ficheiro: PortfolioInvestimentos
            nome: PortfolioInvestimentos-macos
          - os: ubuntu-22.04
            ficheiro: PortfolioInvestimentos
            nome: PortfolioInvestimentos-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow
      - name: Janela própria (pywebview, Windows e macOS)
        if: runner.os != 'Linux'
        run: python -m pip install "pywebview>=5"
      - name: Gerar o executável
        run: pyinstaller packaging/portfolio-investimentos.spec --noconfirm
      - name: Experimentar (demonstração e páginas)
        shell: bash
        env:
          PORTFOLIO_DATA_DIR: ${{ runner.temp }}/dados
        run: |
          set -e
          cd "$RUNNER_TEMP"
          EXE="$GITHUB_WORKSPACE/dist/${{ matrix.ficheiro }}"
          "$EXE" --demo
          if [ "$RUNNER_OS" != "Linux" ]; then "$EXE" --testar-janela; fi  # a janela própria tem de ter entrado
          "$EXE" --no-browser --port 5099 > servidor.log 2>&1 &
          for i in $(seq 1 60); do curl -fs -o /dev/null http://127.0.0.1:5099/ && break; sleep 1; done
          for u in / /carteira /desempenho /dividendos /definicoes /static/css/pm.css; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:5099$u")
            echo "$u $code"
            test "$code" = 200
          done
      - name: Experimentar o modo portátil (dados ao lado do executável)
        shell: bash
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/pen"
          cp "dist/${{ matrix.ficheiro }}" "$RUNNER_TEMP/pen/"
          cd "$RUNNER_TEMP/pen"
          "./${{ matrix.ficheiro }}" --portatil --demo
          ls -la PortfolioInvestimentos-dados
          test -f PortfolioInvestimentos-dados/portfolio.db
      - name: Nome final
        shell: bash
        run: mv "dist/${{ matrix.ficheiro }}" "dist/${{ matrix.nome }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nome }}
          path: dist/${{ matrix.nome }}
          retention-days: 30

  android:
    # app Android (Python embutido com o Chaquopy): gera a APK e experimenta-a num emulador
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.etiqueta, 'v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # a mesma do Chaquopy (android/app/build.gradle)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Código da aplicação para a app
        run: |
          mkdir -p android/app/src/main/python
          cp -r portfolio_investimentos android/app/src/main/python/
          find android/app/src/main/python -name __pycache__ -prune -exec rm -rf {} +
      - name: Chave de assinatura (segredos do GitHub)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/chave.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/chave.jks" >> "$GITHUB_ENV"
          elif [ "$RELEASE" = "true" ]; then
            echo "::error::Falta o segredo ANDROID_KEYSTORE_B64 (ver android/README.md): sem a chave fixa, a APK não se atualiza por cima da anterior."
            exit 1
          else
            echo "Sem chave: a APK de teste fica assinada com a chave de depuração."
          fi
      - name: Gerar a APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DISABLE_SQLALCHEMY_CEXT: "1"
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/PortfolioInvestimentos-android.apk
          ls -la ../dist
      - name: Ativar o KVM (emulador)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Experimentar no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android/testar-emulador.sh dist/PortfolioInvestimentos-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PortfolioInvestimentos-android.apk
          path: dist/PortfolioInvestimentos-android.apk
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.etiqueta, 'v')
    needs: [construir, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: executaveis
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: executaveis/*
          generate_release_notes: true
          tag_name: ${{ inputs.etiqueta || github.ref_name }}
          target_commitish: ${{ github.sha }}

name: iniciar.bat (Windows)

# Experimenta no Windows o arranque com atualização: o iniciar.bat de um clone deteta uma versão nova
# (que muda o próprio iniciar.bat), atualiza, volta a abrir-se e arranca uma só vez.
on:
  workflow_dispatch:
  push:
    paths: ["iniciar.bat", ".github/workflows/iniciar-windows.yml", "requirements.txt"]

jobs:
  atualizar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Origem, clone e uma versão nova
        shell: cmd
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git init --bare "%RUNNER_TEMP%\origem.git"
          git push "%RUNNER_TEMP%\origem.git" HEAD:refs/heads/main
          git clone --branch main "%RUNNER_TEMP%\origem.git" "%RUNNER_TEMP%\app"
          git clone --branch main "%RUNNER_TEMP%\origem.git" "%RUNNER_TEMP%\dev"
          cd /d "%RUNNER_TEMP%\dev"
          echo REM linha acrescentada pela versao nova>> iniciar.bat
          echo nova> VERSAO-2.txt
          git add -A
          git commit -m "versao 2 (muda o iniciar.bat)"
          git push origin main
      - name: Atualizar e arrancar (PORTFOLIO_ATUALIZAR=S)
        shell: cmd
        env:
          PORTFOLIO_ATUALIZAR: S
        run: |
          cd /d "%RUNNER_TEMP%\app"
          call iniciar.bat --help < nul > saida.txt 2>&1
          type saida.txt
      - name: Confirmar
        shell: pwsh
        run: |
          Set-Location "$env:RUNNER_TEMP\app"
          $out = Get-Content saida.txt -Raw
          if (-not (Test-Path VERSAO-2.txt)) { throw "a versao nova nao foi descarregada" }
          if ((Get-Content iniciar.bat -Raw) -notmatch "linha acrescentada") { throw "o iniciar.bat nao foi atualizado" }
          $n = ([regex]::Matches($out, "usage:")).Count
          if ($n -ne 1) { throw "a aplicacao arrancou $n vezes (esperado: 1)" }
          if ($out -match "n.o \S+ reconhecido|is not recognized|nao e reconhecido") { throw "o cmd executou lixo depois da atualizacao" }
      - name: Nova versão, mas PORTFOLIO_ATUALIZAR=N não atualiza
        shell: cmd
        env:
          PORTFOLIO_ATUALIZAR: N
        run: |
          cd /d "%RUNNER_TEMP%\dev"
          git pull
          echo nova> VERSAO-3.txt
          git add -A
          git commit -m "versao 3"
          git push origin main
          cd /d "%RUNNER_TEMP%\app"
          call iniciar.bat --help < nul > saida2.txt 2>&1
          type saida2.txt
          if exist VERSAO-3.txt exit /b 1
          findstr /c:"usage:" saida2.txt || exit /b 1

<!doctype html>
<html lang="pt" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · Portfolio Investimentos</title>
  <script>
    (function () {
      let pref = "auto";
      try { pref = localStorage.getItem("pm-theme") || "auto"; } catch (e) {}
      const dark = pref === "dark" || (pref === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-bs-theme", dark ? "dark" : "light");
    })();
  </script>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <meta name="theme-color" content="#0d6efd">
  <link rel="icon" href="{{ url_for('static', filename='icons/favicon.svg') }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
  <link href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}" rel="stylesheet">
  <link rel="preload" href="{{ url_for('static', filename='vendor/bootstrap-icons/fonts/bootstrap-icons.woff2') }}?dd67030699838ea613ee6dbda90effa6" as="font" type="font/woff2" crossorigin>
  <link href="{{ url_for('static', filename='vendor/bootstrap-icons/bootstrap-icons.min.css') }}" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<main class="container d-flex align-items-center justify-content-center min-vh-100 py-4">
  <div class="card shadow-sm w-100" style="max-width: 420px">
    <div class="card-body p-4">
      <div class="d-flex align-items-center gap-2 mb-4">
        <svg class="pm-logo text-primary" width="28" height="28" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M0 0h1v15h15v1H0zm10 3.5a.5.5 0 0 1 .5-.5h4a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-1 0V4.9l-3.613 4.417a.5.5 0 0 1-.74.037L7.06 6.767l-3.656 5.027a.5.5 0 0 1-.808-.588l4-5.5a.5.5 0 0 1 .758-.06l2.609 2.61L13.445 4H10.5a.5.5 0 0 1-.5-.5"/></svg><span class="fs-4 fw-semibold">Portfolio Investimentos</span>
      </div>
      {% block body %}{% endblock %}
    </div>
  </div>
</main>
</body>
</html>
